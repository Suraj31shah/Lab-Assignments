<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Food Delivery System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <nav>
            <button style="color: white;">Get the App</button>
            <div class="">
                <button class="btn">Login</button>
                <button class="btn btn-red-sm">Sign Up</button>
            </div>
        </nav>
        <div class="box">
        </div>
        <div class="hero">
            <span style="font-size: 150px;">zomato</span>
            <span>Discover the best food & drinks in Chennai</span>

            <div class="hero-buttons">
                <input type="text" placeholder="Custom Colony, Besant Nagar">
                <input type="text" placeholder="Search for a restaurant, cuisine or dish">
            </div>
        </div>
    </div>

    <section class="options">
        <button class="option"><img src="order_food_online.jpg" alt="Order Food"><p>Order Food Online</p></button>
        <button class="option"><img src="go_out_for_a_meal.jpg" alt="Dine Out"><p>Go out for a meal</p></button>
        <button class="option"><img src="night_life_and_clubs.jpg" alt="Nightlife"><p>Night Life & Clubs</p></button>
        <button class="option"><img src="zomato_pro.webp" alt="Zomato Pro"><p>Zomato Pro</p></button>
    </section>
</body>
</html>
